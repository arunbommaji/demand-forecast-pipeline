apiVersion: apps/v1
kind: Deployment
metadata:
  name: demand-forecast-api
  labels:
    app: demand-forecast-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demand-forecast-api
  template:
    metadata:
      labels:
        app: demand-forecast-api
    spec:
      containers:
        - name: demand-forecast-api
          image: demand-forecast-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
